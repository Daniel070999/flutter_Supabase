name: fluttersupabase
description: Herramientas de texto con autenticacion y notas en la nube.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  flutter_slidable: ^4.0.0
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.3
  mobile_scanner: ^6.0.6
  qr_flutter: ^4.1.0
  gal: ^2.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  translator: ^1.0.4+1
  dropdown_button2: ^2.3.9
  google_mlkit_text_recognition: ^0.14.0
  flutter_zoom_drawer: ^3.2.0
  lottie: ^3.3.1
  shared_preferences: ^2.5.2
  read_pdf_text: ^0.3.1
  file_picker: ^8.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  flutter_expandable_fab: ^2.3.0
  fluttertoast: ^8.2.12
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "images/logov5.png"

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/lottie/
